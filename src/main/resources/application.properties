# ===================================================================
# Resource Booking System - Main Configuration
# ===================================================================
spring.application.name=resource-booking-system
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Default: Embedded In-Memory with PostgreSQL compatibility)
# Run with --spring.profiles.active=postgres or --spring.profiles.active=mysql for external DB
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:resource_booking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=ResourceBookingSystemSecretKeyForJwtSigningMustBeAtLeast256BitsLongAndSecure2026!
# Token validity: 24 hours (86,400,000 ms)
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# Swagger / OpenAPI Configuration
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
